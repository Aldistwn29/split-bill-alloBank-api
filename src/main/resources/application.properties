
spring.application.name=splitbill

# Server
server.port=4110

# Database (H2 in-memory: skema dibuat otomatis, data hilang saat proses berhenti)
spring.datasource.url=jdbc:h2:mem:splitbill;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false


#Github
app.github-username=${GITHUB_USERNAME:Aldistwn29}


